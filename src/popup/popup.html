<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>EzyConnector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>EzyConnector</h1>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Đang kiểm tra...</span>
      </div>
      <form id="config-form">
        <label>
          Admin URL
          <input id="admin-url" type="url" placeholder="https://admin.example.com" required />
        </label>
        <label>
          Tài khoản
          <input id="username" type="text" placeholder="Username" required autocomplete="username" />
        </label>
        <label id="password-field">
          Mật khẩu
          <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
        </label>
        <label>
          Domain ảnh được phép
          <textarea id="allowed-image-origins" rows="3" placeholder="https://youngmonkeys.org&#10;https://cdn.example.com"></textarea>
          <small>Mỗi dòng một origin HTTPS. Domain Admin luôn được phép.</small>
        </label>
        <label id="data-consent-field" class="consent">
          <input id="data-consent" type="checkbox" required />
          <span>Tôi đồng ý để EzyConnector nhận thông tin người nhận, nội dung và ảnh từ EzyPlatform, sau đó thao tác trên Zalo OA để gửi tin nhắn.</span>
        </label>
        <p id="error-message" class="error" hidden></p>
        <div class="actions">
          <button type="submit" id="login-btn">Đăng nhập &amp; Kết nối</button>
          <button type="button" id="disconnect-btn">Ngắt kết nối</button>
        </div>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
